<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- FilesKmp app icon: a rounded folder with a dual-pane badge. Original artwork. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2A93B"/>
      <stop offset="1" stop-color="#DE8A1F"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.55" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F7B031"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8DFF"/>
      <stop offset="1" stop-color="#7A5CFA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7A4A00" flood-opacity="0.28"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1E1B6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- back of the folder with its tab -->
    <path fill="url(#back)" d="M40 46h52c7 0 12 2.6 16.4 7.8L120 68h96c11 0 20 9 20 20v104c0 11-9 20-20 20H40c-11 0-20-9-20-20V66c0-11 9-20 20-20z"/>
    <!-- a sheet of paper inside -->
    <rect x="44" y="76" width="168" height="80" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <rect x="58" y="90" width="80" height="8" rx="4" fill="#E6D3A8"/>
    <!-- front flap -->
    <path fill="url(#front)" d="M20 112c0-11 9-20 20-20h176c11 0 20 9 20 20v80c0 11-9 20-20 20H40c-11 0-20-9-20-20z"/>
    <path fill="url(#shine)" d="M20 112c0-11 9-20 20-20h176c11 0 20 9 20 20v6H20z"/>
  </g>

  <!-- dual-pane badge -->
  <g filter="url(#badgeShadow)">
    <rect x="140" y="132" width="100" height="100" rx="26" fill="url(#badge)"/>
    <rect x="140" y="132" width="100" height="46" rx="26" fill="#FFFFFF" opacity="0.12"/>
    <rect x="160" y="154" width="26" height="56" rx="7" fill="#FFFFFF"/>
    <rect x="194" y="154" width="26" height="56" rx="7" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
